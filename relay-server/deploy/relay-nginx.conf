# hana-session-bridge Relay 反代（standby，等 DNS + 证书就绪后启用）
# 用法：certbot 签发后 nginx -t && nginx -s reload
server {
    listen 80;
    server_name relay.myczdfkz.shop;

    # HTTP-01 证书验证（certbot webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/sbti;
        allow all;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }

    access_log /var/log/nginx/relay.access.log;
    error_log /var/log/nginx/relay.error.log;
}

# 复用 8443（SNI 多域名；443 被 frps 占用，勿动）
server {
    listen 8443 ssl http2;
    server_name relay.myczdfkz.shop;

    ssl_certificate /etc/letsencrypt/live/relay.myczdfkz.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.myczdfkz.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # WebSocket 反代到 Relay（64162）
    location /relay {
        proxy_pass http://127.0.0.1:64162;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/relay.access.log;
    error_log /var/log/nginx/relay.error.log;
}
